body:
  text: 孔子大學一書用𫝊古聖王明德新民之道其所從入以致知為始事而誠意次之蓋未有意不誠而能修齊治平一以貫之者也未有知之不極其至而意能誠者也見於經傳者至湯武君臣始相與言學髙宗成王尤勉勉焉湯武上聖而孟子以為反之蓋聖學之難純如此然非謂性之者遂無所為學也觀堯舜禹相𫝊所以審辨於危微之介者非致知之學乎所以致精致一以守其中者非誠意之學乎臣鄂爾泰獲侍皇上講誦於今五年矣曩者嘗承命序樂善堂文鈔其義藴之深閎風格之髙古有目者共識而臣竊觀我皇上鎔經液史所以究興衰治亂之根源察邪正是非之幽渺者皆不襲前賢之緒論而必求自得於心又時就所言反求諸身私慶聖心實能以致知誠意之學體驗於當躬而重為四海生民幸也御極以來動應民志實政實心愾乎天下用能以數月之中俾老幼賢愚皆欣欣然自得於遐荒萬里之外近者幾務餘暇復自擇論辨之文前集所未載者為日知薈說命臣等各綴跋語而御製序文謂録此以驗諸行事伏念我皇上今兹治教之日興乃曩者典學致知之眀效也而猶不忘素學時以自體察又設誠於內而致行之之大驗也夫湯武以堯舜為必可學故能為湯武髙宗成王以湯武為必可學故能為髙宗成王以聖性之髙明聖學之淵粹而加以聖心之誠一三代聖王之治將復見於今矣臣少備宿衛未暇殫心載籍謹就所夙聞於經書者達其愚悃言之不文而以承寵命為愧而已乾隆元年秋七月少保大學士臣鄂爾泰敬跋在昔三代聖王之治皆由學而成凡散見於詩書者其根源可尋繹而見也漢唐以後英明仁厚之君非無性資之髙求治之切者而終無以躋於三代之隆蓋由學焉而未探其根源故所以濬其知者不能深而致於行者不能篤耳我皇上徇齊敦敏夙承世宗憲皇帝之教自問寢視膳而外耳目心志一用之於學而他無間焉故於五經四子之書早洞見其根源而參考漢唐宋元諸儒之義疏以折衷於至當循是以觀諸史其治亂安危之幾無微不察也循是以慎取百家之言其出入離合淺深之數無隱不燭也循是以懸衡人物推極事理皆灼知獨見而無匿情用是發為文章言髙而㫖逺理達而氣昌得心應手俄頃立就而迥出於前賢思議之表臣廷玉奉先帝恩命簡侍講讀十有餘年實親見焉曩者彚集衆體為樂善堂文鈔既承命而為之序近復别擇論辨之文二百六十條為日知薈說仍命臣跋之伏見皇上繼序以來凡見諸政教者一凖於天理而應乎人心之不言而同然是以數月之中近自邦畿逹於山陬海隅莫不欣欣然若時雨之沃其心春陽之被其體蓋我皇上好古敏求日有孜孜以致其知者既深且固故今之宵衣旰食以行所知者篤實充周時措咸宜由是以往法天行健恆久不己則德化所成直比隆於三代豈惟逺過漢唐而已哉臣廷玉讀是編而為天下臣民慶者彌厚且逺焉微特依日月之光挂名簡末而與有榮施也乾隆元年秋七月少保大學士臣張廷玉恭跋臣聞法天之學與時偕行而惟日不足自古聖帝眀王兢兢業業無敢怠荒胥此志也我皇上以睿聖之姿夙禀世宗憲皇帝庭訓冲齡懋學於經史子集靡不綜貫用是發為文章深醇和懿玉振而金聲御製樂善堂文鈔臣既承命而敬為之序矣御極以來夲所學以出治仁育義正粹然純王之道而萬幾之暇不輟編摩復取曩所論述釐為日知薈說四卷仍命臣跋其後臣惟在昔夏先后思日孜孜亦越成湯日新又新逮周成王日就月將學有緝熙于光眀皆以剛健篤實日新其德而兹編命名獨有取於子夏之說者蓋皇上之學基之以望道未見之心勵之以自强不息之力要之以純亦不己之誠故雖聖學髙深已非遊夏所能贊而聖性冲挹惟見義理之無窮則我皇上之心法治法與先聖同揆者即於是乎在豈但文章之盛度越百王已哉臣載稽𫝊記惟日周天惟聖憲天故陽暉所照萬里同晷者清明在躬萬物皆睹之象也嵗度躔次與天相及者體乾行健乘時御天之象也其在天保之章曰如日之升蓋人臣望君德業之昭著福祿之綿長皆取義焉臣以遲暮之年幸厠見知之列材識駑下無能發明聖學於萬一敬述其管蠡窺測所及以竊附於天保詩人之志焉乾隆元年秋七月大學士臣朱軾謹跋我皇上聰明天亶睿哲性成稽古典學孳孳不怠凡天人之奧藴聖賢之述作無不極其源流㫖趣宸章炳煥動合典謨兹萃輯歷年論撰區為四卷名曰日知薈說御製序文辨首宣示近臣臣敏得以與觀乃拜手稽首揚言曰道術之與治術合而不分者也自唐虞以精一執中聿開道統其時在廷諸臣亮工熙績稱極盛焉禹湯文武由之以為治洙泗鄒嶧闡之以為教詩書所載可考而知也漢唐以後非無英君誼辟刻意治平然無格致誠正之學裕諸平日故雖有措注設施非偏而不舉則駁而不純道術治術岐而為二尚論者每致惜焉我皇上懋德日新緝熙時敏實有以見政事之綱紀心性之淵微經史之要眇紬繹發眀洞中窽會故筆諸簡册即可播諸施行臨御以來仁政仁聞光昭逺邇過化存神之盛良由極深研幾藴於素者厚也臣侍從有年學術荒陋無能贊助萬一仰聖製之髙深惟有恭敬奉持深思熟復庶幾稍窺一二不至老而無聞臣不勝深幸且為天下蒼生幸也乾隆元年秋七月都察院左都御史兼翰林院掌院學士臣福敏恭跋臣聞帝王之學必求端於天天以剛健中正運行不息而成嵗功帝王法之精一執中懋昭厥德如禹之思日孜孜湯之聖敬日躋周成之日就月將悉皆遙接心源恢張治道而先天後天與時偕行以馴致久道化成之盛我皇上纘承大統建極綏猷於用人行政阜民敦俗之方犁然各當蓋由夙遵世宗憲皇帝庭訓遜敏敬修熟復六經四子之書旁及儒先之緒言諸史之義法靡不深探力索洞其根源故舉平日所藴蓄見諸治教體立用行與在昔聖帝明王若合符契臣自辛亥嵗侍直內廷敬讀樂善堂文鈔廣大精微櫽括道統嗣後詩賦古文日加裒積臣基親見皇上引筆洋洋千言立就而論說尤多自身心性命國政民生以暨衡論古人一經研剖精義卓立星辰麗而江河行兹以萬幾餘暇親揀擇若干條定為日知薈說夫日君象也易曰日進無疆詩曰如日之升皇上徇齊典學緝熙光明精神貫注於億萬斯年而朝乾夕惕法天行健迪知而允蹈焉心源治道一以貫之凡是書所載包含萬有囊括古今洵典謨之矩矱官禮之菁華也臣就日近光早得霑沐聖訓景星慶雲先覩為快今復賜讀成書承㫖附名卷末益欽盛德大業富有日新而臣材質謭陋仰荷陶成於敷言錫極之中誠屬遭逢之厚幸云乾隆元年秋七月吏部左侍郎兼翰林院掌院學士臣邵基恭跋臣謹稽在昔中天之世聿垂典謨之文其間執中一語舉心法治法一以貫之誠聖學之樞極王道之綱維也凡典謨中所紀欽天授時知人安民亮工熙績諸務何一不從執中流出者乎臣恭誦我皇上御製日知薈說一編尋繹反覆始獲稍窺端緒首言政事則自體元長人探治夲以及治具於任賢儲材教養兵刑之屬一一提其領要而歸於謹德禮導和敬以化成天下為之在優遊而循其序持之在兢業而要諸久至哉言乎蔑有加矣繼論心性溯自於穆流行絪緼化醇之始暨人生而靜感物而動之餘五行禀為五事五性達於五倫善復其初者在明善而固執主敬以存誠天人一理體用一原洵文簡而義該言近而指逺也至於闡發經學尤為剖晰精微開示明切獨得聖賢之心而不泥其辭善會古人之意而不襲其迹期於體之身心純粹而不雜措之治理溥遍而宜民披撥浮華以見夲根陶鑄百家以歸大雅從兹一道德而同風俗悉於經術之昌明决之矣若夫上下千餘年間美任賢從諫懲用佞剝民褒正直忠厚斥僉邪險僻崇敦本務實之圗破迂庸膚末之見悼仁賢之不究厥用惜眀良之難以適逢望古慨然及身思見殆情激而懷長何識髙而度逺布之邦國天下有不奉為千秋之寶鑑振古之鴻篇者乎抑臣由皇言而仰窺皇心蓋於執中之指不啻神相授靣相稽矣外而發之政事內而藴之性情精而剖經義之異同大而鑒人倫之得失莫非本一中為體驗而灼見源流操一中為權衡而不爽豪髮者良由我皇上天亶聰明遜志懋學以至德而凝至道正值我國家重熙纍洽之期行見海隅日出盡躋於風動時雍有不覺太和元氣洋溢於宸章睿藻間矣臣不勝欣悚輒忘其弇鄙矢口而揚言焉乾隆元年秋七月加禮部尚書銜管國子監祭酒事臣楊名時恭跋
