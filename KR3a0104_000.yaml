body:
  text: 欽定四庫全書御製日知薈説序日知薈説者取豫嚮日日課所為文刪擇編次合而録之爰定之以名也豫稟承庭訓懋學書齋留連往復於六經四子之書求其義藴精微旁搜諸史通鑑考定得失區眀法戒以至儒先緒論詞苑菁華莫不遍覽雖究心探索饜飫其中然考之古聖賢躬行實踐之學蓋恧焉而未逮自十有四嵗學屬文至於今又一紀矣其間日課詩論雜文未嘗少輟積成卷帙瑕瑜各半踐阼以來萬幾待理豈復得如曩時專志篤學日與良師友敬業樂羣於翰墨之場哉紬繹舊聞念兹弗釋因取其精去其疵録其正棄其偏合二百六十則釐為四卷而舉凡道德性命之旨學問政治之要經傳之淵源古今之事迹莫不略見梗概夫日知之説出自子夏繼以無忘所能必所知者日新不失而賡續以極于髙眀乃為學問窽要若豫嚮日所得尚非空言而無濟實用則今班朝蒞政之間豈不足自考其知行合一與否以發抒聞見遜敏敦修乎乾隆丙辰中秋日欽定四庫全書子部一御製日知薈説儒家類提要臣等謹案御製日知薈説四卷乾隆元年皇上取舊製各體文刪擇精要得二百六十則釐為四卷第一卷論帝王治化之要卷二卷論天人性命之旨第三卷論禮樂法度之用第四卷論古今得失之迹考三代以前帝王訓誡多散見諸子百家中真膺相參不盡可據漢書所載黃帝以下諸目班固已注為依託亦不足憑惟所載髙帝八篇文帝十二篇為帝王御製著録儒家之始今其書不傳然髙帝當戰伐之餘政兼霸術文帝崇清淨之學源出道家其詞未必盡醇久而散佚或以是歟梁元帝金樓子體儕説部抑又次焉夫詞人所著作盛陳華藻而已帝王之學則必歸于傳心之要義儒生所論説髙談性命而已帝王之學則必徵諸經世之實功故必以聖人之德居天子之位而後吐詞為經足以垂萬世之訓也我皇上亶聰首出念典彌勤紬繹舊聞發揮新得所謂為天地立心為生民立命為往聖繼絶學為萬世開太平者具偹于斯迄今太和翔洽久道化成無逸作所之心與天行同其不息而百度修明八紘砥屬天聲赫濯尤簡册之所未聞豈非內聖外王之道文經武緯之原一一早握其樞要歟臣等校録鴻編循環跪讀欽聖學之髙深益知聖功之有自也乾隆四十一年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書子部一日知薈説儒家類第一卷七十九則第二卷六十則第三卷五十七則第四卷六十四則
