seq: 4
body:
  text: 欽定四庫全書日知薈説卷四周之興肇於文武而文武莫不好仁宜其天下無敵而殷士膚敏裸將于京也穆王耄荒而作刑以詰四方不仁之始也厲王虐而監謗不仁之極也馴致於平王之遷而周遂以不振始也以一國之寡好仁而興終也以天下之衆不仁而失豈非明效大驗哉是故人君清明在躬愷惻存心省刑薄稅節用愛民非徒開一時之治平亦燕貽子孫無疆之業也周宣王中興之業論者比之夏少康非過譽也然其後似不克終考之諸書如廢魯適不藉千畝喪師南國料民太原晏起廢朝而有薑后之諫勤民於逺而有祈父之詩王子晉以厲宣幽平並舉有由來云自古撥亂反正之君必有攀龍附鳳之臣翼贊宣猷共襄大業雖運會使然要亦視乎為君者量之所受秦之亡也髙祖興焉漢之亂也光武復焉是二君者其得人獨多而其享國亦最久非若後世偏安小成者比也髙祖之豁達大度尚矣光武縝密視髙帝差小然馬援稱其恢廓大度同符髙祖其為大司馬而巡河北也南陽鄧禹仗䇿從之光武用其言且親信之於是馮異寇恂耿弇吳漢之儔拔茅彚征咸樂為用二三子者進而天下之大勢歸是光武之量固足以受之矣髙祖修外而不修內者也光武內外兼修者也髙光之得賢才服勍敵與平定海內莫不皆同然既得天下之後髙祖則誅功臣耽酒色光武則保全勳舊興起學校却四夷貢獻以外論之固皆盡美以內論之光武盡善而髙祖猶遜焉是以君子重內而略外謂夫外暫而內恆也漢髙眀髙得天下之正比之唐宋尤為無疵余嘗論之漢髙之天資過於眀髙而明髙之學問優於漢髙漢髙處置後事若燭照龜卜而明髙不能免靖難之亂是其眀識之遜也然立法度理財賦興學校制禮樂經綸之美固非漢髙所能及漢髙有韓彭之戮眀髙有胡藍之獄或則戕害功臣或則株連太廣有損仁厚之風不能為二帝諱然當群雄爭逐之時割據自王各保疆土而能存此不嗜殺之心東蕩西平奄有四海孟子曰保民而王詎不信夫漢明帝畫功臣於雲臺馬援以椒房之戚不得與夫援之功逺過於李忠景丹輩而與馮異寇恂相伯仲者也昔祁奚之見稱於叔向也曰祁大夫內舉不避親外舉不避讐使援而無功則帝之不畫乃公也援而有功則帝之不畫不可為公若謂因外戚而不與是猶有外戚之意存也何如有功而即畫之為正大乎且使後之外戚亦知外戚中有公爾忘私為國宣力如援其人者安知不預化竇憲鄧隲之儔而皆為良善也耶老氏云上德不德若眀帝者其示公而反失大公之道者歟考西漢享國二百餘年東漢亦享國二百蜀漢則自昭烈至於後主僅二世而失之昭烈之賢不及髙光而武侯一人亦不足以比蕭曹張韓鄧馬吳岑之衆况重以後主昏弱而當天已厭漢之時欲其克紹先業奄有九有不亦難哉是以聖王小心畏慎敬天勤民惟日孜孜不敢少懈者誠知訂謨善政克享天心即所以為子孫萬年之計也宋文帝元嘉十六年立四學於京師以儒文史為三途而雜以老莊之學其於先王庠序學校之教失之逺矣善乎司馬溫公之言曰天下無二道安有四學可謂切中文帝之病漢光武與唐太宗皆不世出之君其勤政納諫禮賢興學亦略相等然建武之治不及貞觀者太宗有房杜王魏為之用光武有鄧禹吳漢輩而不盡其用以此見天下之治全在用人而用人之能盡與不能盡則又治之至與不至所以分也或謂光武之不任鄧禹吳漢未始非保全功臣之善道然不擇其臣之賢否而概不任事則亦光武之失歟唐太宗貞觀之治人率多魏徴之直諫不知徴之所以能直諫皆因太宗之虛懷道之使諫從善如流故也然當時進諫者多矣太宗獨歸美於魏徴者亦以徴至公為心而不事形迹面從是戒而必盡讜言任強直之責而不顧擅權之譏陳激切之論而不畏誹謗之議四者有一於此則不能直陳魏徴能去之太宗能察之是以君臣一德為近古所罕覯歟唐太宗之初即位也於放宫女定勳臣之後即置𢎞文館選賢才之士以講求天下之政虛懷納諌以收衆益論止盜則先廉吏欲去佞則務至誠其反覆指陳皆切中時事此誠有見於偃武修文之道即初服之規模而經國久逺燕貽子孫之法舉概見於此矣蓋開創之時武勝而文衰是宜崇文承平之際文興而武弛是宜修武太宗居開創之初天下甫定故崇文以濟武而置館以選舉天下之賢講論天下之政非徒以文詞已也且太宗率將卒習射於顯德殿其不忘武備之意昭昭甚明讀史者慎毋以治天下之道惟在文而不在武斯論得其平而亦萬世保邦之略也唐太宗論張元濟尋究盜狀以魏徴之對但歸過煬帝故有非特煬帝無道臣下亦不盡心之語斯語也豈太宗護惜煬帝而為之辭哉蓋為政之道實在上下一心君必導臣以直臣必事君以忠君有所不知臣必竭忠以告之然後幽隱無蔽天下無不平之患也張元濟之尋究盜狀煬帝實不之知告而不赦斯煬帝之罪也有司以煬帝已令斬決遂不執奏元濟亦不能以所尋實非賊者之六七人上告卒致枉承者二千餘人駢首盡戮是誰之罪歟雖然其所以不上告者亦因煬帝平日之草菅民命有以導之也魏徴既以此戒太宗太宗又以有司及元濟之不入告戒其臣既知深戒乎此則當時之政上必不忍暴刑以虐其下下必不敢欺蔽以愚其上可知已貞觀之所以稱盛治皆由爾時君臣交相警勉孜孜不怠之一念致之也夫清明每始於兢惕而寃濫總起於怠荒豈外一心而他求也哉唐太宗以荀悅漢紀賜李大亮亦出於一時之偶然而尹氏起莘乃以為太宗之勵其臣以義不以利若然則魏徴之諫伐馮盎賜絹五百上十漸疏又賜以金甕豈太宗之視魏徴轉不如大亮之不可以利誘乎夫讀史者亦識其大端知其體要而已若必事事臆度而懸揣之以為古人具有深意焉吾未見其有當也唐元宗躬耕興慶宫側得重農之意抑亦開元之政也當是時元宗志氣清眀留心治理焚珠玉以戒侈賜吐蕃詩書以柔逺天下太平幾致刑措是孰使之然哉亦由元宗勵精圗治用致化理耳元宗能恆保此心勤於為政以養民為先以奉已為後則貞觀之治可得侔矣乃天寶以後卒至荒淫過度百家之産費於一日朱門饜酒肉路旁有餓殍豈向者躬耕重農之心於是而或亡哉良由理不勝欲公不勝私轉愛民之心為剝民之具是知一念之善惡而政教隨之捷於影響可不戒乎唐明皇幸蜀肅宗即位靈武天下多事安史久而後平三鎮相繼以煽兵戈嵗興供餉載道壯者危於鋒刃弱者苦於輸將天下戶口減耗已及三分之二焉然則富庶之盛果足恃乎唐憲宗初年吐突承璀自東宫得幸承間欲有關説憲宗心憚裴垍使勿言及攻澤潞無功而還垍又疏請斥之以謝天下憲宗即罷其領兵聽言圗治若是其鋭也及既定淮蔡志盈意滿信用皇甫鎛等裴度諫之而不聽度之諫其言切於垍而鏄撓亂國政其罪浮於承璀然而取舍頓異者血氣用事心無所主安樂則荒可唐文宗初志以拯亂為務措置乖宜卒召甘露之變其後茍延旦夕保位為幸而顧以衣衫三浣自詡無怪乎栁公綽之嗤其末節也夫為君有為君之體為臣有為臣之體為臣而失為臣之體害止身家為君而失為君之體禍遂蔓延於天下人君當天下已平多難已定雖受四方之奉初無損於聖明即或偶服浣衣亦無不可特非沾沾焉以是為美德也文宗時祖宗之天下大半棄之矣即使卧薪嘗膽猶恐不及尚何顔服浣衣而無愧且自詡盛德也哉三代以下言利之朝莫若漢武帝宋神宗蓋由桑𢎞羊王安石巧説以為不加賦而國用足不知天下之財不在官則在民譬如澤中之水流者日多聚者日涸耳且實而按之當時政治之舛固不待言其所聚之財亦安在哉蕭何與曹參嘗有隙及何沒所薦者惟參參卒守何法而勿失人不多參之能而多何之公也雖然使參常人也則必變何所為且有以議其後漢治幾不紊哉為國之臣不顧已私而惟其治之當韓范上殿爭論下殿不失和氣率用是道然韓范窮經力學夙負經濟才故其所見者大蕭曹起刀筆吏所為有古大臣風余以是為尤難也漢賢相首稱蕭曹不其宜哉漢博士之置雖發自公孫𢎞而董仲舒實開其端賢良䇿云不素養士而欲求賢譬猶不琢玉而求文采也又曰諸不在六藝之科孔子之術者皆絶其道無使並進武帝善其言以仲舒為江都相自後乃置五經博士夫湛深經術孰有過於仲舒者因仲舒之言而置博士反擯仲舒於江都無亦信公孫𢎞之徒而使賢否混淆不得竟用之過歟孔明不遇昭烈則抱膝隆中歌梁甫吟以終老耳昭烈不得孔明則亦拊髀自嘆以是終身焉已然昭烈與孔明何由作合哉故余嘗推司馬德操之氷鑑其功與孔明同良為此也抑又思獻帝時漢室陵夷已不可救使得如德操輩坐鎮朝廷運籌帷幄或尚可挽回萬一余故惜夫漢季之君舍祖宗育養之才以為他人資或隱而弗見至於大事弗可為乃欲與婦人女子謀誅姦雄適以自速其斃不亦大可哀哉孔明用行舍藏之義幾同於顔子而以管仲樂毅自比者豈其志趣規模僅限於二人所成就哉意者公見當時漢綱陵夷黎民塗炭初不異於春秋戰國之際即有管樂亦不足以拯其溺然猶賴得君而小有所就也三顧之前蓋無有能知卧龍者矣目睹時之凋敝而不忍江河之日下有不禁慨然於管樂之尚能遇主者不然以公之迹考公之心設僅以管樂自比則白帝託孤之後大星未隕之前保蜀之功亦足以比於管樂矣何必深思大慮惓惓於漢賊之不兩立王業之不偏安至於鞠躬盡瘁死而後已也哉夫自比管樂而管樂實不逮公此可見公之心之虛而業之廣矣故百世下許公者以為有王佐氣象也羊陸二人惟相知之深故相憚之極不得已而為相好之事君子觀於抗亡而祜亟亟於滅吳可以知當日二人交歡之時勢矣唐史載虞世南志性抗烈每論及古先帝王為政得失必存規諷多所補益太宗嘉之亦曰朕有一言之得世南未嘗不恱有一言之失世南未嘗不悵恨羣臣皆若世南天下何由不理是則太宗之取世南世南之見重於太宗豈徒文學哉世之治也人敦實行而去浮華世之亂也人務虛名而競文藻故文運關乎國運君子於文之厚重澆薄而即以覘時之盛衰隋開皇四年詔公私文翰並宜實録亦一時良法但行之不永有名無實六朝之風未革而隋亦遂以亡蓋六朝之弊始於魏之三祖崇尚文詞橫於晉之何王清談誤世遂使瑰麗競尚古質漸失佻達成風綺靡無行文日繁而政日亂蓋以此也及唐有天下而昌黎韓子出起八代之衰為諸儒之倡始克返華侈而歸質實世道人心有攸賴焉夫言為心聲心之所存而言形之其所係豈淺鮮哉婁師德之薦狄仁傑可謂智深而勇沉者矣武氏固梟狠多猜使師德暴揚仁傑於衆則武氏必疑為一黨仁傑不得用非唐室福也故師德不欲使人知己薦仁傑仁傑亦不自知為師德所薦逮武氏告之而後有婁公盛德之歎此並非仁傑感知己之深乃服其韜晦不露且以復唐自任也逮後姚元之張柬之更進迭用皆因仁傑之舉卒以滅周興唐所謂善處危難有濟困之才者吾於師德見之李光弼大敗史思明於河陽天下之勢遂定當是時實因白孝德奮勇爭先斬賊將劉龍仙而三軍之氣倍增顧未戰而僕固懷恩先賀戰勝曰觀其攬轡安間知必克蓋孝德義理之氣裕於平時故志壯心安也嘗考假太尉逸事狀所載孝德用秀實計署秀實為都虞候郭晞士卒縱暴無賴者皆取以懸藁街後遂不復橫是孝德固以愛民為政非武夫戰卒比故臨敵之際神色自間乃素所涵養然也蓄義理之勇而挾矛大呼亂流竟進是血氣得義理為楨幹而勇乃大勇矣非特孝德之捷為然也光弼之得制全勝亦以是而已矣疾風知徑草板蕩識忠臣天寶之亂順賊者非眀皇素所謂忠臣乎仗節者非明皇素不識靣者乎而顔杲卿兄弟不以位卑職小盡其謀猷矢其忠悃一死於祿山一死於希烈君子以是為尤難也宋李沆為相嘗曰居重位無補惟中外所陳利害一切報罷之朝廷防制纎悉備具或徇所陳行一事即所傷多矣斯言也得失蓋參半焉夫朝廷防制自有章程受之先王百世不易然豈無因時制宜當博採兼聼者乎博採之兼聼之以試其可否果無益於時事罷之可也未嘗試之而一切奏罷豈所以廣言路哉若謂中外所陳利害皆無足觀而惟朝廷舊制是遵則政久弊生亦將置若罔聞乎夫小人妄陳利害擾國政而乖是非者固常有之矣然不可因此而遂絶中外之陳奏也懲噎廢食豈理也哉郭子儀李光弼起朔方牙將振難宣忠克摧逆鋒雖立功各不同而國祚復安二人均有力焉其用兵也軍士咸樂子儀之寬而憚光弼之嚴兩者並稱然吾以為用兵其暫也事君其恆也子儀之事君也功蓋唐室而主不疑權傾天下而衆不嫉朝聞命夕就道用之則竭力勤王舍之則閉門自守光弼晚年頗有嫉讒自安之舉吐蕃寇京師代宗詔光弼入援畏禍遷延不行夫觀其暫若彼觀其恆若此蓋智力可勉強而德量不可勉強故也或曰孔子言君子無爭韓魏公與范文正公上殿爭論下殿不失和氣不失和氣是也上殿之爭非爭乎不知夫子之所謂爭蓋謂相競以氣而不循乎理耳朝廷之上社稷之大計俟吾一言以定是非安危而惟觀望順從緘口不出一言豈君上所賴哉其所爭者非一身一家之事也國與天下之事也至下殿不失其和則仍歸於無爭也若如或人所云則李林甫以立仗馬諷諸言官可謂息爭端而舜禹臯益吁咈一堂之上不可謂中天郅隆之世矣晉文之霸成於城濮之戰其命帥也趙衰舉郤縠焉且曰縠敦詩書而説禮樂詩書義之府也禮樂德之則也然文之勝楚終不在此其稱舍於墓分曹衛之田以畀宋私許復曹衛以擕之執宛春以怒楚皆譎道也雖幸而勝所失亦已多矣使文公眀大義以責楚之不共會諸侯以討楚之有罪其誰不服而必區區用譎豈知德義者哉韓昭侯任用申不害抑亦殘忍矯偽人也即其藏敝袴曰以待有功夫人而無功則不宜賞人而有功則敝袴不可以賞詩曰彤弓弨兮受言藏之我有嘉賔中心貺之言報有功也昭侯欲以敝袴待有功其視功臣何輕哉昭侯與申不害同其心術故忍偽乖張至於此而後世傳為美談至以不僭賞目之抑亦愚矣晏平仲周及三族人服其彰君賜陳氏以家量貸而以公量收晏子識其為奪齊國夫同一施惠於人而晏子與陳氏賢姦各異非公與私之異趣乎漢法陵遲狗尾致誚唐綱不振墨敕肆行至於關內侯因爛羊頭大將軍告勑才易一醉叔世風頽爵位失敘豈惟縉紳之羞亦云國家之憂也宋太祖定法以文武常參官考滿即遷非循名責實之道罷之又任子之法臺省六品諸司五品登朝嘗歷兩任者然後得請所以示名器不輕假人也淳化中置審官院考課中外職事受代京朝官引對磨勘始復序進之制又誕聖節及三年南郊皆聽奏一人特恩不預焉由是奏薦之恩寖廣雖君恩之逮亦非所以慎名器也仁宗用范仲淹富弼䇿乃復定磨勘任子法兩地臣僚非有勳德善狀不得非時進秩京朝官磨勘年限內有無勞績及舉者數取旨朝官須三年無私罪有監司及清望官五人為保任方遷磨勘之法於舊為密焉裁損奏補入仕之路罷聖節奏蔭恩而任子之恩亦殺朝廷之綱紀由是而立名器由是而重而范富之外補亦肇於此矣小人不顧人國而惟已之圖如此哉恐磨勘之嚴而僥幸不得以驟進因奏蔭之殺而姻戚不得以敘官于是惡其興是議者而百方以出之雖仁宗之賢亦不免焉向使磨勘任子之法由是而定則可以傳之後世而無弊宋制多因循范富二公不懼衆人之議毅然行之卒亦不得遂其志焉可歎也夫殷浩纍辭徴辟有似乎清然自其末年達桓溫書一事觀之向之所謂清者有利心焉却利以釣名與攫利同然攫利者人輒輕之而釣名者非具卓識之君子不能别而斥之也殷浩誠士林之蠧哉漢武帝時財窮民困盜賊蜂起一二言利之臣更欲賦民三十以助邉用豈不知民之疲而茫然為之哉無亦伺上意邀恩寵耳自武帝悔悟用田千秋為富民侯由是興利之輩漸去趙過之儔一時並進以是知天下未嘗無人惟在上之嚮用與否耳然千秋之為富民侯蓋亦有説先是千秋為髙廟寢郎上急變訟戾太子寃上由是重之蓋千秋覘上頗知太子無他意也其言借髙祖之神而啓上悟以是時上猶好神仙耳及帝封禪後見羣臣乃言曰朕即位以來所為狂悖宜悉罷之千秋遂進罷遣方士之論則度上意之厭神仙而首變其説也由是觀之千秋豈亦出於蘇張詭遇之術歟不然輪臺悔過之後迄於昭帝在位之年一日未嘗離宰相位而所設施究無可稱則千秋之本末可知矣使千秋有王佐才得武帝英明之君迎其悔過之機殫厥忠悃以輔主德一變至道其所施為必有可觀者語云明君良臣相須殷而相得彰吾於武帝末年蓋惜其無良臣云東漢黨錮之禍此天亡漢而善人君子之厄運也然豫以為時賢亦不能無過者蓋忠直之言小人之讐也小人蟠據於上而遽欲忠直之得信難矣且嶢嶢者易缺皎皎者易汙諸賢相與標榜不為括囊之無咎而為壯趾之征凶亦自速其死也夫死而有益於國家死亦何憾所可惜者死之無益而又使國家有害賢之名是諸賢之所為過甚而未審乎出處之宜也孟子曰位卑而言髙罪也位卑者之所言詎非忠言然在聖明固不待卑位之言而季世又孰用其言者言且足以賈罪而諸賢之矜情厲氣又從而甚之何以免哉昔王安石之禍程伯子曰亦吾輩有以取之則知大賢處世不為太髙之行凡以言語氣節相鼓者必其涵養有未至窮理有未精也歟鍾鄧爭入蜀之功濬渾競平吳之績鍾渾不足論而鄧艾之亡王濬之褊君子有譏焉李訴能於破蔡之日以謙抑自處且有以矯蔡人之頑悍示王朝之禮秩不誠度越諸將哉孫盛書枋頭一事豈尚計一已之聲名榮利者乎計聲名榮利者必不至以死生易之此太史所以重於齊而董狐所以重於晉也其心以為記載在一時而是非昭垂使亂臣賊子不得逃其誅於千載之下雖其身之顛沛流離至死而不顧乃盛於清談盛行之時而獨能不畏強禦以成信史不足多哉陶侃才望素隆使討蘇峻之役如救焚拯溺刻不容緩敵王所愾以全臣節吾謂長沙之績可以與管葛比肩王導謝安非其倫矣而左右觀望心懷不平必待溫嶠反覆開陳而後決在侃固所以疾庾亮也其如朝廷何哉豈其時忘運甓之志歟古弼佐太武常稱之曰社稷臣迹其以弱馬給獵騎則重軍國而輕逰畋也不發牛車運麋鹿則勤民事而緩從禽也夫上有所好在下者惟恐奉行不適上意以獲重譴弼乃權國事之輕重非禮者雖上所命直違之而不豫太武亦知其賢信任有加豈非聼言納諫惟期政理平寧之主哉北魏房景伯之母因郡民有列其子不孝者使其子立堂下而召其母對食命景伯供食凡二十餘日其子叩頭流血母亦涕泣乞還胡氏以為崔母知教化之原吾以為景伯固一州之長也州之民不知其幾百千萬也使景伯知教化之原在於孝弟而躬親以率之學校以教之奬善以勸之罰惡以懲之興孝舉弟敬老慈幼則州之民羣化於孝弟且無至景伯之堂而母子相陳以傷天倫者矣今州有一人焉列其子之不孝者崔母命景伯供食以愧之且至二十餘日之久設州民復有如是者崔母又將命景伯供食歟又將二十餘日歟是舍一州之政而惟供食以示民之是務將不勝其敝且勞矣教化之原夫寧若是夫所謂原者若網之綱裘之領茍能提綱而挈領則順者不可勝數也孝弟誠教化之原然非平日有以興其天良使民皆知孝弟之在已確然而不可移肫然而不能已亦何能移風易俗胥天下而丕變哉故就一事論崔母知教化之權就州長論景伯實未盡教化之道也范寧數進忠言指斥姦黨素為孝武所親徒以疾王國寶卒被譖出為外郡此可見正人難近小人易惑雖素所信任之人而一入讒説黜之無疑也使孝武不出范寧徐邈等國寶之亂未必至此極而王恭輩晉陽之甲亦無辭以興矣語曰善人天地之紀也其言豈欺我哉牛李爭納維州司馬公以為德裕所言者利也僧孺所言者義也維州本唐地有故有之地此舉不涉於為利矣且天子以四海為家人之慕義而來者固可以拒之不受而且使歸以斃其命乎况僧孺非挾讐之言為猶可當時牛李之黨已成矣僧孺徒欲以快私忿不知敗德裕之事即所以敗國家之事人臣不忠莫此為甚而司馬公猶以為義乎至胡氏則以為以維州歸吐蕃失祖宗土宇縛送悉怛謀沮歸附之心僧孺以小信妨大計夫以小信妨大計猶為僧孺曲言之綱目大書曰吐蕃將悉怛謀來歸維州不曰叛而曰來及贈以右衛將軍也又特書於後無有貶辭則知悉怛謀之來歸李德裕之欲受皆出於至正僧孺不過欲沮德裕而為之辭耳吾據綱目書法以斷司馬胡氏之論而牛李之是非已不辨而明也田疇被劉虞一日之知為虞達表長安及虞討公孫瓚不克而死疇歸祭謁虞墓雖瓚之威有所弗顧後居徐無能相約束結以威信北邉翕然其人之信義才智皆非常人所及逮曹操擊烏桓欲封為侯又固拒不受吾益信疇為當時罕見之人惜乎漢政陵夷不能復振使賢能者鬱於下而不伸若疇者僅一見用於劉虞而未遂厥志抱恨以終嗚呼其亦可哀也矣唐自肅代德順禍亂相仍而宦寺之用事日甚一日中使不已至於監軍監軍不已至於典禁典禁不已至於佐命於是建置天子在其掌握而威權出人主之右原其始由天子之寵信太甚考其終天子欲求其一笑而不得是豈非勢之日流日下而禍已釀成雖有智者亦僅付之太息流涕而莫可如何然劉蕡不顧已之死生存亡而忠言讜論亹亹數千言使正士覽之而氣壯智者鑒之而逺害雖一時無救於禍敗而千載共仰其忠誠豈不偉哉唐室藩鎮之禍至德宗之世極矣當是時人各懷不臣之心天子威令不能下行即擁兵觀望未忍逆命者亦不多得况其志雪朝廷之耻而恭順恪謹相率以勤王事者豈非天下所公與哉李抱真以數騎詣王武俊營開誠布公勸以忠義約為兄弟誓同滅賊雖抱真逼於田恱未必無自全之䇿而於朱滔田恱諸鎮逆命之秋獨能以誠悟武俊相率勤王此綱目所以褒美特筆書之亦春秋之旨歟且夫師克在和武俊之軍於南宫也兩軍尚相疑二使抱真微有顧望之志則事不諧矣抱真告其司馬則曰今日之舉繫天下之安危若其不還領軍事以聽朝命亦惟子勵將士以雪讐耻亦惟子是置已之死生安危於度外而惟以國家之事為重者也卒得武俊之和而朱滔不久敗亡天下於是稍定非抱真之功其誰之功哉乃逆命者未聞有所誅斥而效順者未聞有所褒嘉馴致賞亦有所不受誅亦有所不懼國不可以為國矣吾故以是嘆德宗之暗也唐之季世民困極矣有張全義者獨能以愛民為先籌其衣食時人為之語曰張公不喜聲伎惟喜佳麥良繭豈非知政夲者乎全義雖不如古之名臣亦可謂是時之良臣使僖宗置之相位授以重任彼既能規晝於河南豈不能措置於朝寧所以挽頺波而拯溺俗必更有可觀者而終於是已焉君子以是重為唐惜之王建起草賊終能得蜀保有一邦其聽軍士王先成條列七事遂以取彭州非有經逺之慮取才之量不能也然建既用其言而不録其人是能取賢而不能任賢也苻堅得一王猛委任之専遂有天下之半先成所白七事實當時之要務與捫虱而談者何異若能推廣其意而善行之天下不足平也而建不能宜乎所保有者止一蜀地而已薛聰仕北魏為侍御史每遷必讓讓必固魏主褒之曰卿天爵自髙固非人爵之所能榮也蓋自伏軾結靷之士以順為正不知禮義亷耻之可尊而惟以博金紫取祿位為事夫然故在上者益不知士之可貴而謂爵祿在上之所司可以奔走牢籠天下天下士惟吾命之是從而上日尊士日賤非上之驕亦下之自賤使之也聰能修天爵而不要人爵可貴在已而不在人於是魏主亦以非人爵所能榮稱之使君不敢目士為惟吾所奔走牢籠者薛聰也自成其貴而并有以成君之美視三代以下驕諂之俗顧不偉歟顧不偉歟孔子曰鄙夫可與事君也與哉其未得之也患得之既得之患失之茍患失之無所不至矣夷考千古國家之興未始不因得賢者而其衰未始不由用鄙夫代宗廣德元年河北諸州已降有史朝義降將薛嵩田承嗣李懷仙者叩懷恩馬首乞行間自效懷恩恐賊平寵衰奏留嵩等以為黨援朝廷亦厭兵遂以為節度使河北三鎮之橫自此始是後治兵完城自署將吏貢賦不通婚姻相援父死子嗣兄終弟及朝廷有弗從則三鎮連橫以拒命流至於李茂貞韓建朱全忠之亂而唐遂以亡嗚呼懷恩之恐賊平寵衰亦細事耳由此一念代宗不悟因循茍且授人太阿其後未嘗無憲宗之剛斷武宗之英眀而卒莫之救懷恩鄙夫固不足論獨恨代宗用患得患失之人而弗知自貽其禍其後懷恩亦終至於叛使當時用郭子儀李光弼為將則消患於未然定亂於未萌又安有藩鎮逆命之事乎然是時郭李之不得董兵由魚朝恩程元振居中用事實阻撓之是以知人君欲去外之鄙夫必先去其內之鄙夫欲去內之鄙夫又當先去其心之鄙暗董子曰人君正心以正朝廷正朝廷以正百官正百官以正萬民未有失其夲而能治其末者也未有亂其內而能正其外者也故人君治天下有道曰先正其心天下之事有敗於怠忽而成於乾惕者亦有得於雍容而失於拘謹者蓋雍容可也怠忽不可也乾惕可也拘謹不可也唐李德裕之相武宗史稱其休沐如令沛然若無事時豈非雍容有度而不過為拘謹者哉夫人之處事亦限於才力之大小譬射之能中百步者百少以外不能保其必中元和以後之相竭蹶從事不暇休沐或繼火乃罷然所理者何亂所服者何鎮是拘謹之無成而才力之不足有為也德裕遇武宗君臣相資卓然有拯亂之志而兼有禁暴之才故其時內侍斂迹藩鎮屏息至其休沐如令在德裕則可在他人則不可蓋德裕之才力比他相為有餘耳玉之在璞追師知之珠之在蚌鮫人知之惟人之品術極始終之殊致雖古帝猶難知之然知人之道亦驗之於理而已矣唐王楊盧駱一時稱為能文裴行儉以勃等雖有文華而浮躁淺露非能享爵祿者楊子稍沉靜應至令長餘得令終幸矣其後皆如其言行儉之所以知四子者亦豈外夫揆之以理哉當其時四子之所以行已與夫行儉之所以觀人必不僅如史之所紀學者不以理揆之必以行儉之知人為神竒不測如是則聖人何必以為難哉夫神竒不測非難而平易合道之難其能以理論人者必其自足於理者也唐綱不振教息風頺専務姑息藩鎮強橫浸淫至於五代割據兼并犯令陵政伺弱乘危以成逆志登受禪之臺竊黼扆之座者皆藩鎮也以故朱溫秉旄宣武當羣雄觀望之時首發大難逞其凶頑椒殿血流唐祚移矣既而亞子興晉陽之甲𢎞繼事之志屬均王膏粱之子才能不過中人又朱氏稔惡之後梁之宗社一旦歸唐宜矣莊宗鋭始怠終從珂移鎮召禍敬塘一入唐遂以亡背約取危晉亦頓滅智逺之得國頗正而承祐無逺大之志奮誅戮之威使郭威得以藉口一舉而漢祚復移於周蓋五十餘年之間凡五易國而其間以别姓入繼者又可指數也五代之亂可謂至極至宋而天下始定於一豈勢力所及哉有道故也推其致亂之由皆藩鎮跋扈尾大不掉太祖以杯酒片言解數百年不可解之錮習而天下之治平亦不盡係乎此功德不足以及兆民區區智取術馭豈能久逺乎故運世必有其本也王安石免役之令不為無補既無追呼刑責之苦且鮮挽輸力作之勞而按戶科配所費實鮮當時士大夫顧以口角爭之且爭之而不能窮其詞如文彥博云惟與士大夫治天下非與百姓治天下是豈足以折安石之喙乎彥博之説似本於孟子巨室之所慕一國慕之之意不知此正所以與百姓治天下也即當時免役豈能無弊弊在務多斂而取贏也又在今雖免役而異日助役如故仍復受役也彥博不知議及此但云祖宗法制不可更張以失人心至以為與士大夫共治非與百姓共治尤理不足以伸其詞是皆安石逆料必有是論而適合其意者也豈足以移安石之志哉古人云天下治亂關宰相人主得失係經筵張居正輔政當顯宗沖齡屢進講經史外則總攬朝政明智善斷於時治雖未純亦可謂之小康君雖未哲亦可謂之守道蓋居正以一人而兼宰相經筵之任皆有成效非有大過人之才不能獨其剛愎自用嫉人長護己短懼大權他屬髙拱以元老而被斥馮保以姦宦而交通至於廢制守喪心冀留任何不顧義理至此極也雖然顯宗有居正而朝廷清明天下無事太僕寺積金至四百餘萬及居正沒而內則奢侈外則盜賊民不聊生蓋居正心不端而才有餘公不足而智有餘方之房魏韓范非其等夷方之李林甫蔡京大相徑庭大約張説吕夷簡之儔而乘時建立過之謂之忠臣不可謂之姦臣不可吾將謂之才臣焉乃身沒未幾家産籍沒子嗣逺竄雖禍自己召顯宗亦刻薄寡恩哉徐有功當武氏肆毒於上酷吏恣虐於下守死善道為人所難為其度量過人逺矣卒之保護善類紀綱不至大壞人心不至大散狄仁傑又培植之而張東之遂因以復唐祚人但知有功為周行寬政而不知有功為唐之苦心也唐人潘好禮著論以為勝於張釋之特為其持刑一節可至有功之心事尚未深切言之歟三代以下稱賢君者漢有文帝唐有太宗皆恭儉惠愛政無繁苛民用以寧然文帝之德雖優於太宗而時少名臣有賈誼而不能盡其用唐之房杜王魏同心一德相贊一庭貞觀之治尤稱盛焉至四年豐穰極矣豈無致之之故哉夷考其時上嘗與羣臣語及教化封德彛勸帝以刑罰繩天下魏徴勸行仁義上卒從徴言偃武修文與民休息至於四年天下遂大稔流散者歸鄉里斗米三錢夜户不閉上歸功於魏徴而曰惜乎不使封德彞見之夫人君莫不説順已之人而惡逆耳之言太宗獨從魏徴而逺封德彞其修已固已審矣既臻其盛不忘規諫之人二喜一懼之論尤致意焉此其所以保安常治而不危也歟千古之學無二端也內不欺己外不欺人者謂之學內負於己外負於人者則不得復謂之學然已不負人強恕者猶能勉焉至寧人負己則非知命不惑者不能唐德宗時四十餘州大水陸贄請賑德宗謂淮西貢賦既缺不必遣賑而贄以秦穆救飢寧人負我無我負人為言德宗乃悟胡氏寅以忠恕知命許之當矣而又謂敬輿之學為誠洙泗之徒夫世有洙泗之學而可以偽為者哉寅蓋有慨於周衰道廢權謀名法清淨之術凡自外於洙泗之學者皆能立功效於一時而後之學者多浮慕焉故以贄為之凖的也夫德宗之世羣小用事正人不容德宗復以猜忌御下欲人臣之各盡其情難矣獨贄以忠誠明辨開悟人主而所言亦間被施行是其為學實無愧於天無怍於人而非曲學取媚之可比人臣致身其尚以贄為法哉唐憲宗之始即位也稱名相者四人杜黃裳裴垍李絳裴度是也黃裳遇君於初而抱才以沒志未大施裴度克平淮蔡卓乎尚矣獨裴垍李綘出處略同然綘以讒罷垍以病終眀哲保身綘猶遜於垍乎夷考唐史所載垍之言曰垍不敢以私害公又稱其獨賞諫官之能言時事者則垍之所以保身實出於君子之眀哲而非委曲從時偷容取媚者所可比夫不敢以私害公不過人臣自善之一端而賞諫官之言事則是以言事君繩愆糾繆格其非心得古大臣之遺則矣諸葛孔明為三代以下第一流人物約其生平亦曰公忠二字而已公故無我忠故無私無我無私然後志氣清明而經綸中理故其言曰我心如稱不能為人作輕重所謂止水無心而平量明鏡無心而照形以物為心而不逐於物者也尤不可及者孔明之器識規模三代以下未見其倫比而况區區一隅之人士乎乃數戒羣吏勤攻其過失其虛以受人而不敢自是如此此其所以肩隨於伊吕也歟唐姚崇宋璟為相有髙仲舒者博通典籍有齊浣者練習時務姚宋每坐二人以質所疑且曰欲知古問髙君欲知今問齊君姚宋能知二人之賢亦已難矣又况能知二人之各有所長推斯道也雖虞廷官人工虞水火各當其材者亦不過因是以馴致耳人臣外而忘家內而忘身并忘己之勳猷莭概然後能遇非常之事而處之一如其常茍不能忘其勳猷節槩則猶視君與已為二人而有所牽制何則信道猶未篤自知猶未明也韓魏公之為臣實能忘身忘家并忘其勳猷節概者也故不動聲色而措天下於泰山之安且並不見已之措天下於泰山之安若魏公者亦可謂信道篤而自知明矣信道篤而自知明則雖無魏公之時位亦可以信其能措天下於泰山之安如顔子之簞瓢陋巷不改其樂是也而其氣象規模又穆乎其深逺矣日知薈説卷四
